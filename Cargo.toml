[package]
name = "manitou"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/manitou"
homepage = "https://github.com/savageAZfck/manitou"
license = "MIT"
description = "Weight provenance: per-file SHA-256 manifests of model weights, signed brain_manifest records on every load/swap, and drift verification — which manitou was in the body when the words came out, named for the spirit inhabiting a thing"
keywords = ["provenance", "weights", "manifest", "audit", "integrity"]
categories = ["data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
